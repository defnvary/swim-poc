# Swim — main config (the only hand-written nginx file)
user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /var/log/nginx/access.log;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # proxy defaults (inherited by all vhosts)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 3600s;   # SSE / log streams
  proxy_send_timeout 3600s;

  # websocket upgrade (no-op for plain HTTP)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # TLS defaults
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # unknown Host / SNI gets nothing (nginx:1 is >= 1.19.4)
  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  # generated vhosts: platform + app subdomains + custom domains
  include /etc/nginx/conf.d/apps/*.conf;
}
