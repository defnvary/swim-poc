name: swim

services:
  nginx:
    image: nginx:1-alpine
    container_name: swim-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - swim-conf:/etc/nginx/conf.d/apps:ro
      - swim-certs:/etc/letsencrypt:ro
      - swim-webroot:/var/www/certbot
    networks: [swim-edge]
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    container_name: swim-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - swim-data:/data
      - swim-conf:/data/nginx
      - swim-certs:/etc/letsencrypt
      - swim-webroot:/var/www/certbot
    networks: [swim-edge, swim-internal]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:17-alpine
    container_name: swim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swim
    volumes:
      - swim-pgdata:/var/lib/postgresql/data
    networks: [swim-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swim -d swim"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  swim-edge:
    name: swim-edge
    external: true
  swim-internal:

volumes:
  swim-data:
  swim-conf:
  swim-certs:
  swim-webroot:
  swim-pgdata:
